name: lumoney
description: "Aplikasi money management & celengan lokal."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-700.ttf
          weight: 700
        - asset: assets/fonts/GoogleSansFlex-800.ttf
          weight: 800
